x\">No open leads.<\u002Fp><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n<p class=\"muted\" style=\"margin: 6px 0 0; font-size: 12px\">Only open leads are listed. For a repeat order from an existing client, open the client and use Upload repeat PO.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ upHasMatch }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"{{ upMatchStyle }}\">{{ upMatchText }}<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 14px\">Step 2 · Check what the AI read from the PDF<\u002Fh3>\n<p class=\"muted\" style=\"margin: 0; font-size: 13px\">Filled in by AI from the PDF. Correct anything that is wrong before saving.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px\">\n<div><span class=\"lbl\">Customer<\u002Fspan><div style=\"font-size: 14px; min-height: 40px; display: flex; align-items: center\">{{ up.customer }}<\u002Fdiv><\u002Fdiv>\n<div><label class=\"lbl\" for=\"up-cpo\">Customer PO number<\u002Flabel><input id=\"up-cpo\" class=\"field\" type=\"text\" value=\"{{ up.custPo }}\" sc-camel-on-change=\"{{ up.set.custPo }}\"><\u002Fdiv>\n<div><label class=\"lbl\" for=\"up-date\">PO date<\u002Flabel><input id=\"up-date\" class=\"field\" type=\"date\" value=\"{{ up.date }}\" sc-camel-on-change=\"{{ up.set.date }}\"><\u002Fdiv>\n<div><label class=\"lbl\" for=\"up-del\">Deliver by<\u002Flabel><input id=\"up-del\" class=\"field\" type=\"date\" value=\"{{ up.deliver }}\" sc-camel-on-change=\"{{ up.set.deliver }}\"><\u002Fdiv>\n<div><label class=\"lbl\" for=\"up-ld\">Late-delivery penalty<\u002Flabel><input id=\"up-ld\" class=\"field\" type=\"text\" value=\"{{ up.ld }}\" sc-camel-on-change=\"{{ up.set.ld }}\"><\u002Fdiv>\n<div><label class=\"lbl\" for=\"up-terms\">Payment terms<\u002Flabel><input id=\"up-terms\" class=\"field\" type=\"text\" value=\"{{ up.terms }}\" sc-camel-on-change=\"{{ up.set.terms }}\"><\u002Fdiv>\n<\u002Fdiv>\n<span class=\"lbl\" style=\"margin: 4px 0 0\">Items on the PO<\u002Fspan>\n<datalist id=\"prod-list2\"><option value=\"Reflective Safety Jacket\"><\u002Foption><option value=\"Hi-Vis Reflective Vest\"><\u002Foption><option value=\"LED Reflective Safety Jacket\"><\u002Foption><option value=\"Auto-Glow Reflective Safety Jacket\"><\u002Foption><option value=\"FR Coverall\"><\u002Foption><option value=\"FR Jacket\"><\u002Foption><option value=\"FR Trousers\"><\u002Foption><option value=\"FR Hood\"><\u002Foption><option value=\"3M Scotchlite reflective tape\"><\u002Foption><option value=\"Safety helmet\"><\u002Foption><option value=\"Safety gloves\"><\u002Foption><option value=\"Safety shoes\"><\u002Foption><\u002Fdatalist>\n<sc-for list=\"{{ up.lines }}\" as=\"ln\" hint-placeholder-count=\"2\">\n<div style=\"border: 1px solid #E4E4DE; border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; align-items: end\">\n<div style=\"grid-column: span 2\"><label class=\"lbl\" for=\"{{ ln.iid }}\">Item {{ ln.n }}<\u002Flabel><input id=\"{{ ln.iid }}\" class=\"field\" type=\"text\" list=\"prod-list2\" value=\"{{ ln.item }}\" sc-camel-on-change=\"{{ ln.set.item }}\"><\u002Fdiv>\n<div><label class=\"lbl\" for=\"{{ ln.sid }}\">Sizes (use /)<\u002Flabel><input id=\"{{ ln.sid }}\" class=\"field\" type=\"text\" value=\"{{ ln.size }}\" sc-camel-on-change=\"{{ ln.set.size }}\" placeholder=\"M / L / XL\"><\u002Fdiv>\n<div><label class=\"lbl\" for=\"{{ ln.qid }}\">Quantity per size (use /)<\u002Flabel><input id=\"{{ ln.qid }}\" class=\"field\" type=\"text\" value=\"{{ ln.qty }}\" sc-camel-on-change=\"{{ ln.set.qty }}\" placeholder=\"200 / 300 / 100\"><\u002Fdiv>\n<div style=\"display: flex; gap: 6px; align-items: end\"><div role=\"group\" aria-label=\"{{ ln.typeAria }}\" style=\"display: flex; gap: 4px\"><button type=\"button\" aria-pressed=\"{{ ln.isMake }}\" style=\"{{ ln.makeStyle }}\" sc-camel-on-click=\"{{ ln.setMake }}\">Make<\u002Fbutton><button ty on><option>Embroidery<\u002Foption><option>DTF<\u002Foption><option>No logo<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n<div><label class=\"lbl\" for=\"ch-tape\">Reflective tape<\u002Flabel><sc-raw-select id=\"ch-tape\" class=\"field\" value=\"{{ ch.tape }}\" sc-camel-on-change=\"{{ ch.setTape }}\"><option>3M Scotchlite 50 mm<\u002Foption><option>3M Scotchlite 25 mm<\u002Foption><option>Reflective trim<\u002Foption><option>PVC reflective tape<\u002Foption><option>No tape<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n<div><label class=\"lbl\" for=\"ch-zip\">Closure<\u002Flabel><sc-raw-select id=\"ch-zip\" class=\"field\" value=\"{{ ch.zip }}\" sc-camel-on-change=\"{{ ch.setZip }}\"><option>YKK zipper<\u002Foption><option>Velcro<\u002Foption><option>Buttons<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n<\u002Fdiv>\n<div><label class=\"lbl\" for=\"ch-notes\">Notes for the floor (optional)<\u002Flabel><input id=\"ch-notes\" class=\"field\" type=\"text\" value=\"{{ ch.notes }}\" sc-camel-on-change=\"{{ ch.setNotes }}\" placeholder=\"e.g. transparent ID pocket on left chest, name on back\"><\u002Fdiv>\n<sc-if value=\"{{ upHasErr }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin: 0; color: #B91C1C; font-size: 14px; font-weight: 600\">{{ upErr }}<\u002Fp><\u002Fsc-if>\n<div style=\"display: flex; gap: 8px\"><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ saveUpload }}\">{{ upSaveLabel }}<\u002Fbutton><button class=\"btn\" sc-camel-on-click=\"{{ toggleUpload }}\">Cancel<\u002Fbutton><\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"display: flex; gap: 8px; flex-wrap: wrap\"><sc-for list=\"{{ orderFilters }}\" as=\"f\" hint-placeholder-count=\"4\"><button style=\"{{ f.style }}\" sc-camel-on-click=\"{{ f.pick }}\">{{ f.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<div class=\"card\" style=\"padding: 0; overflow-x: auto\">\n<div style=\"min-width: 960px\">\n<div class=\"th\" style=\"grid-template-columns: 100px minmax( rrentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>All orders<\u002Fbutton><\u002Fdiv>\n<section class=\"card noprint\" style=\"display: flex; flex-direction: column; gap: 18px\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: flex-start\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<div style=\"display: flex; gap: 12px; align-items: center; flex-wrap: wrap\"><h1 style=\"margin: 0; font-size: 24px\">{{ po.id }} · {{ po.customer }}<\u002Fh1><span style=\"{{ po.pillStyle }}\">{{ po.prod }}<\u002Fspan><\u002Fdiv>\n<span class=\"muted\" style=\"font-size: 14px\">Customer PO {{ po.custPoText }} · {{ po.plant }} · Handled by {{ po.handler }}<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center\">\n<sc-if value=\"{{ po.hasLead }}\" hint-placeholder-val=\"{{ true }}\"><button class=\"btn btn-sm\" sc-camel-on-click=\"{{ po.openLead }}\">Open client<\u002Fbutton><\u002Fsc-if>\n<sc-if value=\"{{ po.notQueued }}\" hint-placeholder-val=\"{{ false }}\"><button class=\"btn btn-primary btn-sm\" sc-camel-on-click=\"{{ po.addToQueue }}\">Add to production queue<\u002Fbutton><\u002Fsc-if>\n<sc-if value=\"{{ po.prodWaiting }}\" hint-placeholder-val=\"{{ true }}\"><button class=\"btn btn-primary btn-sm\" sc-camel-on-click=\"{{ go.production }}\">Go to Production queue · {{ po.posShort }}<\u002Fbutton><\u002Fsc-if>\n<sc-if value=\"{{ po.prodStarted }}\" hint-placeholder-val=\"{{ false }}\"><span role=\"status\" style=\"{{ po.prodChip }}\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M3 8.5l3 3 7-7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>{{ po.prodChipText }}<\u002Fspan><\u002Fsc-if>\n<sc-if value=\"{{ po.prodDone }}\" hint-placeholder-val=\"{{ false }}\"><button class \"><button class=\"btn btn-primary\" type=\"submit\">Send to admin<\u002Fbutton><button class=\"btn\" type=\"button\" sc-camel-on-click=\"{{ closeAll }}\">Cancel<\u002Fbutton><\u002Fdiv>\n<\u002Fform>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"display: flex; flex-direction: column; gap: 16px\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center\">\n<div><h1 style=\"margin: 0; font-size: 24px\">Production queue<\u002Fh1><p class=\"muted\" style=\"margin: 4px 0 0\">Comes from: made lines of every saved PO. Shows when each order joined the queue and when it passed each stage. First in, first out; any change in order needs admin approval and is logged. When an order is marked ready, it leaves this queue and moves to Dispatch.<\u002Fp><\u002Fdiv>\n<button class=\"btn\" sc-camel-on-click=\"{{ togglePrint }}\">Print sequence for the floor<\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{ printOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<section class=\"card\" style=\"display: flex; flex-direction: column; gap: 10px\">\n<div style=\"display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap\"><strong>Production sequence · printed 25 Nov 2026 by {{ me }}<\u002Fstrong><span class=\"muted\" style=\"font-size: 13px\">Last change approved by: {{ lastApprover }}<\u002Fspan><\u002Fdiv>\n<sc-for list=\"{{ queueRows }}\" as=\"q\" hint-placeholder-count=\"5\"><div style=\"display: flex; gap: 12px; font-size: 14px; border-top: 1px solid #EFEFEA; padding-top: 8px\"><strong style=\"width: 28px\">{{ q.pos }}<\u002Fstrong><span style=\"flex: 1\">{{ q.id }} · {{ q.customer }} · {{ q.make }} · <strong>{{ q.stage }}<\u002Fstrong><\u002Fspan><span class=\"muted\">by {{ q.deliver }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n<div style=\"display: flex; gap: 8px\"><button class=\"btn btn-primary btn-sm\" sc-camel-on-click=\"{{ doPrint }}\">Print<\u002Fbutton><button class=\"btn btn-sm\" sc-camel-on-click=\"{{ togglePr tlOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding: 0 16px 16px 56px; display: flex; flex-direction: column; gap: 0\">\n<span class=\"lbl\" style=\"margin-bottom: 6px\">Production timeline · {{ q.id }}<\u002Fspan>\n<sc-for list=\"{{ q.tl }}\" as=\"t\" hint-placeholder-count=\"3\"><div style=\"display: grid; grid-template-columns: 16px 200px 160px 1fr; gap: 10px; align-items: start; font-size: 13px; padding: 6px 0; border-top: 1px solid #EFEFEA\"><span style=\"{{ t.dot }}\"><\u002Fspan><strong>{{ t.stage }}<\u002Fstrong><span>{{ t.at }}<\u002Fspan><span class=\"muted\">{{ t.detail }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n<sc-if value=\"{{ q.hasNextUp }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display: grid; grid-template-columns: 16px 200px 160px 1fr; gap: 10px; font-size: 13px; padding: 6px 0; border-top: 1px dashed #D6D6CF; color: #5D6470\"><span style=\"width: 10px; height: 10px; border-radius: 50%; border: 2px solid #C9C9C1; box-sizing: border-box; margin-top: 3px\"><\u002Fspan><span>Next: {{ q.nextUp }}<\u002Fspan><span>not started<\u002Fspan><span><\u002Fspan><\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start\">\n<section class=\"card\">\n<h2 style=\"margin: 0 0 8px; font-size: 16px\">Requests waiting for approval<\u002Fh2>\n<sc-if value=\"{{ noPending }}\" hint-placeholder-val=\"{{ false }}\"><p class=\"muted\" style=\"font-size: 14px\">No requests waiting.<\u002Fp><\u002Fsc-if>\n<sc-for list=\"{{ pendingReqs }}\" as=\"r\" hint-placeholder-count=\"1\">\n<div style=\"border-top: 1px solid #EFEFEA; padding: 12px 0; display: flex; flex-direction: column; gap: 6px\">\n<div style=\"font-weight: 600\">{{ r.po }} · {{ r.customer }}<\u002Fdiv>\n<div class=\"muted\" style=\"font-size: 13px\">Move to position {{ r.toPos }} · asked by {{ r.by }}<\u002Fdiv>\n<div sty : 12px\">\n<div><label class=\"lbl\" for=\"sf-how\">How<\u002Flabel><sc-raw-select id=\"sf-how\" class=\"field\" value=\"{{ sf.how }}\" sc-camel-on-change=\"{{ sf.set.how }}\"><option>Called transporter<\u002Foption><option>Emailed transporter<\u002Foption><option>WhatsApp to transporter<\u002Foption><option>Visited transporter office<\u002Foption><option>Called customer<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n<div><label class=\"lbl\" for=\"sf-who\">Spoke to<\u002Flabel><input id=\"sf-who\" class=\"field\" type=\"text\" value=\"{{ sf.who }}\" sc-camel-on-change=\"{{ sf.set.who }}\" placeholder=\"e.g. TCI Chennai branch, Mr. Kumar\"><\u002Fdiv>\n<div><label class=\"lbl\" for=\"sf-exp\">New expected delivery (if given)<\u002Flabel><input id=\"sf-exp\" class=\"field\" type=\"date\" value=\"{{ sf.exp }}\" sc-camel-on-change=\"{{ sf.set.exp }}\"><\u002Fdiv>\n<\u002Fdiv>\n<div><label class=\"lbl\" for=\"sf-note\">What they said *<\u002Flabel><textarea id=\"sf-note\" class=\"field\" rows=\"3\" value=\"{{ sf.note }}\" sc-camel-on-change=\"{{ sf.set.note }}\" placeholder=\"e.g. stuck at Chennai hub due to vehicle breakdown, delivery by 27 Nov\"><\u002Ftextarea><\u002Fdiv>\n<sc-if value=\"{{ sf.hasErr }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin: 0; color: #B91C1C; font-size: 14px; font-weight: 600\">{{ sf.err }}<\u002Fp><\u002Fsc-if>\n<div style=\"display: flex; gap: 8px\"><button class=\"btn btn-primary\" type=\"submit\">Save follow-up<\u002Fbutton><button class=\"btn\" type=\"button\" sc-camel-on-click=\"{{ closeAll }}\">Cancel<\u002Fbutton><\u002Fdiv>\n<\u002Fform>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ su.open }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"modal-bg\" sc-camel-on-click=\"{{ modalBg }}\" sc-camel-on-key-down=\"{{ modalKey }}\"><div class=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Update status · {{ su.title }}\"><div class=\"modal-head\"><h2 style=\"margin: 0; font-size: 18px\">Update status · {{ su.title }}<\u002Fh2><button type=\"button\" class=\"xbtn\" aria-label=\"Close\" sc-camel-on-click=\"{{ closeAll }}\">×<\u002Fbutton><\u002Fdiv>\n<p class=\"muted\" style=\"margin: 0; font-size: 14px\">Use this for transporters whose website cannot be read automatically, or to record the delivery.<\u002Fp>\n<form style=\"display: flex; flex-direction: column; gap: 12px\" sc-camel-on-submit=\"{{ su.save }}\">\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px\">\n<div><label class=\"lbl\" for=\"su-stage\">New status<\u002Flabel><sc-raw-select id=\"su-stage\" class=\"field\" value=\"{{ su.stage }}\" sc-camel-on-change=\"{{ su.set.stage }}\"><option>In transit<\u002Foption><option>Out for delivery<\u002Foption><option>Delivered<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n<div><label class=\"lbl\" for=\"su-place\">Where<\u002Flabel><input id=\"su-place\" class=\"field\" type=\"text\" value=\"{{ su.place }}\" sc-camel-on-change=\"{{ su.set.place }}\" placeholder=\"e.g. Nagpur hub\"><\u002Fdiv>\n<div><label class=\"lbl\" for=\"su-date\">Date<\u002Flabel><input id=\"su-date\" class=\"field\" type=\"date\" value=\"{{ su.date }}\" sc-camel-on-change=\"{{ su.set.date }}\"><\u002Fdiv>\n<div><label class=\"lbl\" for=\"su-time\">Time<\u002Flabel><input id=\"su-time\" class=\"field\" type=\"time\" value=\"{{ su.time }}\" sc-camel-on-change=\"{{ su.set.time }}\"><\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{ su.isDelivered }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px\">\n<div><label class=\"lbl\" for=\"su-recv\">Received by *<\u002Flabel><input id=\"su-recv\" class=\"field\" type=\"text\" value=\"{{ su.recv }}\" sc-camel-on-change=\"{{ su.set.recv }}\" placeholder=\"Name and role at the customer\"><\u002Fdiv>\n<div><label class=\"lbl\" for=\"su-pod\">Proof of delivery (signed copy)<\u002Flabel><input id=\"su-pod\" class=\"field\" type=\"file\" sc-camel-on-change=\"{{ su.setPod }}\"><\u002Fdiv>\n<\u002Fdiv><\u002Fsc-if>\n<div><label class=\"lbl\" for=\"su-note\">Note (optional)<\u002Flabel><input id=\"su-note\" class=\"field\" type=\"text\" value=\"{{ su.note }}\" sc-camel-on-change=\"{{ su.set.note }}\"><\u002Fdiv>\n<sc-if value=\"{{ su.hasErr }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin: 0; color: #B91C1C; font-size: 14px; font-weight: 600\">{{ su.err }}<\u002Fp><\u002Fsc-if>\n<div style=\"display: flex; gap: 8px\"><button class=\"btn btn-primary\" type=\"submit\">Save status<\u002Fbutton><button class=\"btn\" type=\"button\" sc-camel-on-click=\"{{ closeAll }}\">Cancel<\u002Fbutton><\u002Fdiv>\n<\u002Fform>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: flex-end\"><div><h1 style=\"margin: 0; font-size: 24px\">Dispatch and tracking<\u002Fh1><p class=\"muted\" style=\"margin: 4px 0 0\">Pack ready orders, then follow every shipment until it is delivered. Each update is saved with date, time and source.<\u002Fp><\u002Fdiv><span class=\"muted\" style=\"font-size: 13px\">Transporter websites last checked: today, 09:00 (checked every morning)<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px\">\n<sc-for list=\"{{ dboard }}\" as=\"b\" hint-placeholder-count=\"5\"><button style=\"{{ b.style }}\" sc-camel-on-click=\"{{ b.pick }}\"><span style=\"font-size: 12px; font-weight: 700; color: #5D6470; text-transform: uppercase; letter-spacing: .04em\">{{ b.label }}<\u002Fspan><span style=\"{{ b.numStyle }}\">{{ b.count }}<\u002Fspan><span class=\"muted\" style=\"font-size: 12px\">{{ b.hint }}<\u002Fspan><\u002Fbutton><\u002Fsc-for>\n<\u002Fdiv>\n<sc-if value=\"{{ dispatchMsg }}\" hint-placeholder-val=\"{{ false }}\"><section class=\"card\" style=\"background: #E7F4EC; border-color: #A7D7B8; font-size: 14px\">{{ dispatchMsg }}<\u002Fsection><\u002Fsc-if>\n<section class=\"card\" style=\"display: flex; flex-direction: column; gap: 4px\">\n<h2 style=\"margin: 0; font-size: 16px\">Step 1 · Ready to pack and dispatch<\u002Fh2>\n<p class=\"muted\" style=\"margin: 0 0 8px; font-size: 13px\">An order appears here when production marks it ready. It can be packed only when every line, made and bought in, is ready.<\u002Fp>\n<sc-if value=\"{{ noReady }}\" hint-placeholder-val=\"{{ false }}\"><p class=\"muted\" style=\"margin: 0; font-size: 14px\">Nothing waiting. Mark an order ready in the Production queue.<\u002Fp><\u002Fsc-if>\n<sc-for list=\"{{ readyRows }}\" as=\"r\" hint-placeholder-count=\"2\">\n<div style=\"border-top: 1px solid #EFEFEA; padding: 12px 0; display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center\">\n<div style=\"display: flex; flex-direction: column; gap: 4px\"><span><button class=\"linkbtn\" sc-camel-on-click=\"{{ r.open }}\">{{ r.id }}<\u002Fbutton> · {{ r.customer }}, {{ r.plant }}<\u002Fspan><span class=\"muted\" style=\"font-size: 13px\">{{ r.linesText }} · deliver by {{ r.deliver }}<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 8px; align-items: center; flex-wrap: wrap\"><span style=\"{{ r.pill }}\">{{ r.statusText }}<\u002Fspan><sc-if value=\"{{ r.ready }}\" hint-placeholder-val=\"{{ true }}\"><button class=\"btn btn-primary btn-sm\" sc-camel-on-click=\"{{ r.start }}\">Pack and dispatch<\u002Fbutton><\u002Fsc-if><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fsection>\n<sc-if value=\"{{ pk.open }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"modal-bg\" sc-camel-on-click=\"{{ modalBg }}\" sc-camel-on-key-down=\"{{ modalKey }}\"><section class=\"modal modal-lg\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Pack and dispatch\" style=\"gap: 16px\">\n<div style=\"display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap\"><h2 style=\"margin: 0; font-size: 18px\">Pack and dispatch {{ pk.id }} · {{ pk.customer }}<\u002Fh2><button class=\"btn btn-sm noprint\" sc-camel-on-click=\"{{ closePack }}\">Close<\u002Fbutton><\u002Fdiv>\n<div class=\"noprint\" style=\"display: flex; flex-direction: column; gap: 12px\">\n<h3 style=\"margin: 0; font-size: 15px\">1 · Delivery address and boxes<\u002Fh3>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px\">\n<div style=\"grid-column: 1 / -1; display: flex; flex-direction: column; gap: 10px\">\n<span class=\"lbl\" style=\"margin: 0\">Deliver to (this exact address is printed on every box label and saved with the dispatch)<\u002Fspan>\n<sc-if value=\"{{ pk.hasBook }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center\"><span class=\"muted\" style=\"font-size: 13px\">Saved addresses for {{ pk.customer }}:<\u002Fspan><sc-for list=\"{{ pk.book }}\" as=\"b\" hint-placeholder-count=\"2\"><button type=\"button\" style=\"{{ b.style }}\" aria-pressed=\"{{ b.on }}\" sc-camel-on-click=\"{{ b.pick }}\">{{ b.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fsc-if>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px\"><div><label class=\"lbl\" for=\"pka-name\">Contact person and role<\u002Flabel><input id=\"pka-name\" class=\"field\" type=\"text\" value=\"{{ pk.a.name }}\" sc-camel-on-change=\"{{ pk.set.name }}\" placeholder=\"e.g. R. Meena (Stores In-charge)\"><\u002Fdiv><div><label class=\"lbl\" for=\"pka-company\">Company<\u002Flabel><input id=\"pka-company\" class=\"field\" type=\"text\" value=\"{{ pk.a.company }}\" sc-camel-on-change=\"{{ pk.set.company }}\" placeholder=\"e.g. Kaveri Cables Ltd\"><\u002Fdiv><div style=\"grid-column: 1 / -1\"><label class=\"lbl\" for=\"pka-line1\">Address line 1<\u002Flabel><input id=\"pka-line1\" class=\"field\" type=\"text\" value=\"{{ pk.a.line1 }}\" sc-camel-on-change=\"{{ pk.set.line1 }}\" placeholder=\"Plot / building,
